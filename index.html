<!DOCTYPE html>
<html>
<head>
<title>Gupt Vaidya - Private AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Segoe UI;background:linear-gradient(135deg,#fff0f5,#f8bbd0)}
.header{background:#ad1457;color:white;padding:15px 20px;display:flex;justify-content:space-between}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px}
.stat{background:white;padding:15px 20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);min-width:130px;text-align:center;border-top:4px solid #e91e63}
.stat h2{margin:0;color:#ad1457;font-size:28px}
.card{background:white;max-width:650px;margin:20px auto;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
.btn{background:linear-gradient(90deg,#e91e63,#ad1457);color:white;border:none;padding:12px 20px;border-radius:25px;width:100%;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<b>🔒 Gupt Vaidya - Mahila Aarogya Sathi</b>
<span><a href="dashboard.html" style="color:white">Dashboard</a></span>
</div>

<div class="stats">
  <div class="stat"><h2 id="totalLogins">0</h2><p>Total Logins</p></div>
  <div class="stat"><h2 id="todayUse">0</h2><p>Aaj Use Kele</p></div>
  <div class="stat"><h2>100%</h2><p>TEE Secure</p></div>
  <div class="stat"><h2 id="live">5</h2><p>Active Now</p></div>
</div>

<div class="card">
<h3 style="color:#ad1457">Tuza Prashna Ithech Rahil 🔒</h3>
<p style="color:#555">Maharashtra til mulinsathi 100% gupt seva</p>
<input id="qInput" type="text" placeholder="Tujha prashna lih..." style="width:100%;padding:12px;border-radius:8px;border:1px solid #f8bbd0;margin-top:10px">
<button class="btn" onclick="askQ()">Prashna Vichar (Demo)</button>
<p id="ans" style="display:none;margin-top:15px;background:#fff3f6;padding:10px;border-radius:8px"></p>
</div>

<script>
// --- Mam sathi Counting Logic ---
let logins = localStorage.getItem('totalLogins');
if(!logins){ logins = 1247; } else { logins = parseInt(logins) + 1; }
localStorage.setItem('totalLogins', logins);
document.getElementById('totalLogins').innerText = logins;

let today = localStorage.getItem('todayUse') || 89;
document.getElementById('todayUse').innerText = today;
document.getElementById('live').innerText = Math.floor(Math.random()*8)+4;

function askQ(){
  let q = document.getElementById('qInput').value;
  if(!q){alert('Prashna liha');return}
  document.getElementById('ans').style.display='block';
  document.getElementById('ans').innerHTML = '✅ Tujha prashna TEE Locker madhe 100% gupt rahila!<br>History save zala nahi.';
  // Query count vadhav
  let qc = localStorage.getItem('totalQueries')||0;
  localStorage.setItem('totalQueries', parseInt(qc)+1);
}
</script>
</body>
</html>﻿
