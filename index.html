<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gupt Vaidya - Mahila Sathi</title>
<script>
  if(localStorage.getItem("isLoggedIn") !== "true"){
    window.location.href="login.html";
  }
</script>
<style>
body{font-family:Arial;margin:0;background:#fff5f6}
header{background:#c94a6a;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold;font-size:20px}
nav ul{list-style:none;display:flex;gap:15px;margin:0;padding:0}
nav a{color:white;text-decoration:none;font-weight:bold}
nav a.logout-btn{background:white;color:#c94a6a;padding:6px 12px;border-radius:15px}
section{padding:30px;text-align:center}
input{padding:10px;width:60%;border-radius:8px;border:1px solid #ffb6c1}
button.ask{padding:10px 20px;background:#c94a6a;color:white;border:none;border-radius:20px;margin-left:10px;cursor:pointer}
#answerBox{margin-top:20px;background:white;padding:15px;border-radius:10px;display:none;box-shadow:0 0 10px #ffc0cb;white-space:pre-wrap;text-align:left;max-width:600px;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<header>
<div class="logo">Gupt Vaidya - Mahila Sathi</div>
<nav>
<ul>
<li><a href="#home">Home</a></li>
<li><a href="#about">About</a></li>
<li><a href="#features">Features</a></li>
<li><a href="#contact">Contact</a></li>
<li><a href="#" onclick="logout()" class="logout-btn">Logout</a></li>
</ul>
</nav>
</header>

<section id="home">
<h2 style="color:#c94a6a">Tumcha Prashna Vichara</h2>
<p>Guptatechi Hami - TEE Privacy Project</p>
<br>
<input type="text" id="qInput" placeholder="Tumcha prashna ithe liha...">
<button class="ask" onclick="showAnswer()">Vichara</button>
<div id="answerBox"></div>
</section>

<script>
function showAnswer(){
 var q=document.getElementById('qInput').value;
 var box=document.getElementById('answerBox');
 if(!q){box.style.display='block';box.innerText='Krupaya prashna liha!';return;}
 box.style.display='block';
 box.innerHTML='⏳ Process hotoy TEE madhe...';
 setTimeout(function(){
   var ans='Tumcha Prashna: "'+q+'"\n\nAnswer: Ha data TEE (Trusted Execution Environment) madhe process zala aahe, tyamule tumchi mahiti 100% surakshit aahe.';
   box.innerText=ans;
   box.scrollIntoView({behavior:'smooth'});
 },600);
}

document.getElementById('qInput').addEventListener('keydown',function(e){
 if(e.key==='Enter'){showAnswer();}
});

document.querySelectorAll('nav a').forEach(a=>{
 a.addEventListener('click',function(e){
   if(this.getAttribute('href').startsWith('#')){
     e.preventDefault();
     var id=this.getAttribute('href').substring(1);
     var el=document.getElementById(id);
     if(el) el.scrollIntoView({behavior:'smooth'});
   }
 });
});

function logout(){
  localStorage.removeItem("isLoggedIn");
  window.location.href="login.html";
}
</script>
</body>
</html>
