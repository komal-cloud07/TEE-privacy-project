html<!DOCTYPE html>
<html>
<head>

<style>

.header{background:#ad1457;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}

.btn{background:linear-gradient(90deg,#e91e63,#ad1457);color:white;border:none;padding:12px 20px;border-radius:25px;width:100%;font-size:16px;cursor:pointer;margin-top:10px}
input{width:95%;padding:12px;border-radius:8px;border:1px solid #f8bbd0;margin-top:10px;font-size:15px}
.ansbox{margin-top:15px;background:#fff3f6;padding:12px;border-radius:8px;border-left:4px solid #e91e63;display:none}
</style>
</head>
<body>
<div class="header">
<b>🔒 Gupt Vaidya - Mahila Aarogya Sathi</b>

<script>

  }else if(q.includes("stress")||q.includes("tension")||q.includes("udasi")||q.includes("zop")||q.includes("anxiety")){
    ans="<b>🔒 Stress / Zop na yene sathi:</b><br>1. Ratri 10-6 zop purna ghya<br>2. Divsat 10 min deep breathing<br>3. Zopaycha 1 tas aadhi mobile band<br>4. Maitrini / tai shi man mokle kara<br><br><i>Ha chat history madhe save jhala nahi.</i>";
  }else if(q.includes("white")||q.includes("safed")||q.includes("discharge")||q.includes("pani")){
    ans="<b>🔒 White Discharge:</b><br>Thodya pramanat normal aahe. Cotton kapde vapra, jagah swachh theva. Jar khaj, jaljal, durgandhi asel tar doctor la nakki dakhva.";
  }else{
    ans="<b>🔒 Tujha Prashna:</b> '"+qRaw+"'<br><br>✅ He 100% gupt thevla aahe. TEE madhech answer process jhala, server var save nahi jhala.<br><br><b>Salla:</b> Santulit aahar, jast pani, roz 30 min chalane. Gambhir asel tar Mahila Doctor la bheta.";
  }
  document.getElementById('ans').style.display='block';
  document.getElementById('ans').innerHTML=ans;
  let qc=localStorage.getItem('totalQueries')||245;
  localStorage.setItem('totalQueries', parseInt(qc)+1);
}
</script>
</body>
