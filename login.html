<!DOCTYPE html>
<html>
<head>
<title>Login - Private AI</title>
<link rel="stylesheet" href="style.css">
<style>
.login-box{max-width:350px;margin:80px auto;padding:20px;background:white;border-radius:15px;text-align:center}
input{width:90%;padding:10px;margin:10px;border-radius:8px;border:1px solid pink}
button{padding:10px 20px;background:#ff69b4;color:white;border:none;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div class="login-box">
<h2>Gupt Vaidya - Login</h2>
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">
<br>
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>
<script>
function login(){
 let u = document.getElementById('user').value;
 let p = document.getElementById('pass').value;
 if(u!="" && p!=""){
   localStorage.setItem("isLoggedIn","true");
   localStorage.setItem("username",u);
   window.location.href="index.html";
 } else {
   document.getElementById('msg').innerText="Username Password tak!";
 }
}
</script>
</body>
</html>
